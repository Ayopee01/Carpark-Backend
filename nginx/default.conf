# ส่ง header Upgrade ต่อให้ Socket.IO เปลี่ยนจาก HTTP long-polling เป็น WebSocket ได้ (request ปกติใช้ Connection ว่าง = keep-alive กับ upstream)
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

server {
  listen 80;
  server_name _;

  client_max_body_size 5m;

  location / {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Socket.IO: WebSocket ต้องส่ง Upgrade/Connection ต่อ และไม่ตัด connection ที่ยังส่ง heartbeat อยู่
  location /socket.io/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
