name: CI

# PR: ตรวจโค้ดและลอง build image (ไม่ push)
# push main: ตรวจ -> push image ไป GHCR -> deploy Production
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # database ชั่วคราวสำหรับรัน migration แล้วเทียบกับ schema.prisma
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # รัน migration ทั้งหมดแล้วล้มเมื่อ schema.prisma มีการเปลี่ยนที่ยังไม่มีไฟล์ migration (กัน deploy แล้ว database ไม่มี column ใหม่)
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      - run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      # ตรวจ type ของ src, test และ seed แบบ strict แล้ว build เป็น dist
      - run: npx tsc -p test/tsconfig.json --noEmit
      - run: npm run build
      - run: npm test

  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # ชื่อ image ใน GHCR ต้องเป็นตัวเล็ก
      - name: Image name
        id: name
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      # tag sha-<commit 7 ตัว> ใช้ deploy/rollback และ main ชี้ image ล่าสุด
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.repo }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit
